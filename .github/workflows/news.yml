name: Cool News pipeline

on:
  schedule:
    # ~7am AEST / 8am AEDT. GitHub's cron doesn't do timezones, so this is a fixed UTC time and
    # will drift an hour across daylight saving — close enough for a "once a day" job.
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/news/package-lock.json

      - name: Install pipeline dependencies
        working-directory: scripts/news
        run: npm install

      - name: Run pipeline
        working-directory: scripts/news
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node run.mjs

      - name: Commit updated news data
        run: |
          git config user.name "peaceful-pursuit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "news: automated update $(date -u +%Y-%m-%d)"
            git push
          fi
